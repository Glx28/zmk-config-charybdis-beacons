description: |
  Sets the active pipeline of a zmk,input-processor-pipeline-switch
  processor to an absolute index. Vendored change (charybdis-zmk-config):
  takes binding params instead of upstream's zero-param cycle.
  param1 = pipeline index (0..N-1), param2 = persist to flash (0/1).

compatible: "zmk,behavior-pipeline-switch"

include: two_param.yaml

properties:
  processor:
    required: true
    type: phandle
    description: The pipeline-switch input processor to control.
