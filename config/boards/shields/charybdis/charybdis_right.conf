CONFIG_SPI=y

CONFIG_SPI=y
CONFIG_INPUT=y
CONFIG_ZMK_POINTING=y

CONFIG_ZMK_EXT_POWER=y

# Driver: badjeff/zmk-pmw3610-driver @ zmk-0.3 branch (see west.yml).
# CPI and axis mapping moved to devicetree (charybdis_right.overlay):
# cpi = <400> is the effective pointer CPI directly -- there is NO software
# scaler and NO divider in the real trackball's path (the driver's CPI_DIVIDOR
# was raw integer division with no remainder carry: any movement smaller than
# the divider registered as zero, a permanent dead zone; badjeff's driver has
# no divider at all).
# Whole-vector jump acceleration lives in charybdis.keymap/jump_accel, wired
# onto &trackball_listener, and reads raw 400-CPI counts directly; its
# jump-start-cps/jump-width-cps thresholds were calibrated against the old
# 600 CPI baseline, so a physical swipe must be slightly faster to reach the
# same acceleration onset.
# Pointer speed modes (snipe/fast, hold and toggle) are key behaviors built
# from input processors on &trackball_listener -- see charybdis.keymap. There
# is deliberately NO layer-linked CPI switching anymore.
CONFIG_PMW3610=y
CONFIG_PMW3610_SMART_ALGORITHM=y
# If the log shows "Incorrect product id 0xFF (expecting 0x3E)!" on cold boot,
# uncomment: CONFIG_PMW3610_INIT_POWER_UP_EXTRA_DELAY_MS=1000
