CONFIG_SPI=y

CONFIG_SPI=y
CONFIG_INPUT=y
CONFIG_ZMK_MOUSE=y

CONFIG_ZMK_EXT_POWER=y

# Effective 400 CPI for precision (33% slower than the prior 600, picked over
# in-between combos like 1800/divider=4 that hit a cleaner 20-30% target,
# because ANY divider > 1 introduces a real dead zone: the driver floors each
# poll's delta with no remainder carry (pmw3610.c: x = delta/dividor), so any
# movement smaller than the divider registers as zero, permanently. Divider=1
# is the identity - zero dead zone, same as before, just at a lower raw CPI.
# There is NO software scaler in the real trackball's path (&trackball_listener
# has no zip_xy_scaler) -- this raw sensor CPI value IS the effective CPI
# directly. Whole-vector jump acceleration lives in charybdis.keymap/jump_accel
# instead, wired onto &trackball_listener, and reads these raw counts directly;
# its jump-start-cps/jump-width-cps thresholds are still calibrated against the
# old 600 CPI baseline and were deliberately left unchanged, so the same
# physical swipe now produces fewer raw counts/sec and needs to be swiped
# faster to reach the same acceleration onset than before this change.
# DIVIDOR stays 1: the driver's CPI_DIVIDOR is raw integer division of each poll's
# delta with NO remainder carry (pmw3610.c: x = delta/dividor) — at >1 it floors
# slow movement to 0 = "slow turn = no input" dead zone. NEVER use it to lower CPI.
# NOTE: SNIPE_CPI is the driver name for an alternate pointer CPI capability.
# The active target layer is configured in charybdis_right.overlay. That target is
# a firmware capability switch, not a semantic layer role; generated layouts must
# infer the target layer's human role from bindings and usage data.
# SNIPE_CPI=3200 vs base 400 is now an 8:1 fast:slow ratio (up from 5.33:1 at
# the prior 600 base), also with no scaler in between -- both are raw CPI.
# Polling at native 250 Hz for smoother curves at this lower DPI.
CONFIG_PMW3610=y
CONFIG_PMW3610_CPI=400
CONFIG_PMW3610_CPI_DIVIDOR=1
CONFIG_PMW3610_ORIENTATION_90=y
CONFIG_PMW3610_SNIPE_CPI=3200
CONFIG_PMW3610_SNIPE_CPI_DIVIDOR=1
CONFIG_PMW3610_SCROLL_TICK=70
CONFIG_PMW3610_INVERT_X=y

CONFIG_PMW3610_POLLING_RATE_250=y
CONFIG_PMW3610_SMART_ALGORITHM=y

# CONFIG_PMW3610_AUTOMOUSE_TIMEOUT_MS=250

