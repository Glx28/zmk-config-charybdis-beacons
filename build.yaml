# This file generates the GitHub Actions matrix
# For simple board + shield combinations, add them
# to the top level board and shield arrays, for more
# control, add individual board + shield combinations to
# the `include` property, e.g:
#
# board: [ "nice_nano_v2" ]
# shield: [ "corne_left", "corne_right" ]
# include:
#   - board: bdn9_rev2
#   - board: nice_nano_v2
#     shield: reviung41
#
---
include:
  - board: nice_nano_v2
    shield: charybdis_right
    snippet: studio-rpc-usb-uart
    variant: pmw3610-boot-delay-diag
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DZMK_EXTRA_MODULES="$GITHUB_WORKSPACE/config/modules/input_processor_jump_accel;$GITHUB_WORKSPACE/config/modules/input_processor_pipeline_switch;$GITHUB_WORKSPACE/config/modules/coach_beacon"
