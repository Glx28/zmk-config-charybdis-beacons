description: |
  Speed-based acceleration curve for relative pointer input (REL_X/REL_Y).
  The processor blends base-factor and fast-factor across the configured
  speed interval. An optional independent travel-distance window can gate
  acceleration until enough path distance has accumulated, preventing brief
  fast movements from immediately receiving high gain.

compatible: "zmk,input-processor-jump-accel"

include: ip_zero_param.yaml

properties:
  base-factor:
    type: int
    required: true
    description: Fixed-point multiplier (x1000) applied below jump-start-cps, e.g. 1000 = 1.0x

  fast-factor:
    type: int
    required: true
    description: Fixed-point multiplier (x1000) applied above jump-start-cps + jump-width-cps

  jump-start-cps:
    type: int
    required: true
    description: Whole-vector speed, in raw sensor counts/sec, where the transition begins

  jump-width-cps:
    type: int
    required: true
    description: Width, in raw sensor counts/sec, of the transition band between the two factors

  curve-type:
    type: string
    enum:
      - smootherstep
      - exponential
      - hockey-stick
    default: smootherstep
    description: |
      Shape of the gain ramp. smootherstep keeps the existing smooth S-curve.
      exponential provides a gentle low-speed rise with a stronger middle and
      high-speed range. hockey-stick keeps the early ramp gentle and rises more
      sharply near the high-speed end.

  speed-smoothing-ms:
    type: int
    default: 0
    description: |
      Time constant for low-pass filtering the speed estimate. Zero preserves
      the raw estimate. Nonzero values smooth per-event speed jitter; stale
      perpendicular-axis samples older than 12ms are ignored.

  velocity-window-ms:
    type: int
    default: 0
    description: |
      Estimate speed from total travelled X/Y path length over this rolling
      event window. Zero uses the legacy per-event estimate. The window resets
      after an idle gap longer than its duration.

  distance-window-ms:
    type: int
    default: 0
    description: |
      Separate rolling window used to require enough accumulated path travel
      before acceleration is applied. Zero disables the distance gate.

  distance-start-counts:
    type: int
    default: 0
    description: |
      Accumulated path counts within distance-window-ms below which the
      distance gate remains closed.

  distance-width-counts:
    type: int
    default: 0
    description: |
      Additional accumulated path counts over which the distance gate smoothly
      opens from zero to full acceleration. Zero disables the distance gate.

  gain-smoothing-ms:
    type: int
    default: 0
    description: |
      Time constant in milliseconds for smoothing the final acceleration factor.
      This can reduce visible gain pumping when the speed estimate varies near
      the middle of the curve. Zero disables gain smoothing.
