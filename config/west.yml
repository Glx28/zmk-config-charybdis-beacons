manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: badjeff
      url-base: https://github.com/badjeff
    - name: cormoran
      url-base: https://github.com/cormoran
    - name: gggw
      url-base: https://github.com/Good-Great-Grand-Wonderful
  projects:
    - name: zmk
      remote: zmkfirmware
      revision: v0.3
      import: app/west.yml
    # PMW3610 driver: badjeff's maintained fork, zmk-0.3 branch (pinned).
    # Do NOT use main: it targets ZMK main/Zephyr 4.1 with the renamed
    # pixart,pmw3610-alt compatible and CONFIG_PMW3610_ALT_* prefix.
    - name: zmk-pmw3610-driver
      remote: badjeff
      revision: 5c5af40de4d8cdf55dc63c4c5907af1e52da6a95
    # Runtime input processor: hold-key temporary scaling (snipe/fast hold).
    - name: zmk-module-runtime-input-processor
      remote: cormoran
      revision: main
    # Persistence backend required by the runtime input processor module.
    - name: zmk-feature-custom-settings
      remote: cormoran
      revision: main
    # Pipeline switch: key-press toggling between cursor/snipe/fast pipelines.
    - name: zmk-input-processor-pipeline-switch
      remote: gggw
      revision: main

  self:
    path: config
