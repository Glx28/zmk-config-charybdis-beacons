CONFIG_SPI=y

CONFIG_SPI=y
CONFIG_INPUT=y
CONFIG_ZMK_POINTING=y

# ZMK_POINTING requires threaded input. The pinned PMW3610 driver is patched
# to wait for queue space and retain unsent deltas; priority and queue depth
# keep that consumer ahead of sensor bursts.
CONFIG_INPUT_THREAD_PRIORITY=-2
CONFIG_INPUT_QUEUE_MAX_MSGS=128

# Coach layer telemetry uses a separate vendor-defined HID interface (HID_1).
# Keyboard and mouse reports remain on ZMK's standard HID_0 interface.
CONFIG_USB_HID_DEVICE_COUNT=2

CONFIG_ZMK_EXT_POWER=y

# Driver: badjeff/zmk-pmw3610-driver @ zmk-0.3 branch (see west.yml).
# Trackball sensor is configured for 400 CPI. Whole-vector 1x-to-3x response
# shaping is applied by jump_accel on the physical listener. Avoid independent
# per-axis smoothing or low fixed output scales: they attenuate sign reversals.
# Sensor sampling stays at 4ms.
# Tracking stall was resolved by disabling shutter-based smart-mode switching below, not by CPI.
# Pointer speed modes (snipe/fast, hold and toggle) are key behaviors built
# from input processors on &trackball_listener -- see charybdis.keymap. There
# is deliberately NO layer-linked CPI switching anymore.
CONFIG_PMW3610=y
# The pinned driver's deep REST stages default to 100 ms and 500 ms samples.
# Faster rest sampling prevents long first-motion delays after extended idle.
CONFIG_PMW3610_REST2_SAMPLE_TIME_MS=40
CONFIG_PMW3610_REST3_SAMPLE_TIME_MS=40
# Disable the driver's shutter-based switching of sensor register 0x32.
# The user confirmed normal tracking after this software switching was disabled.
CONFIG_PMW3610_SMART_ALGORITHM=n
# If the log shows "Incorrect product id 0xFF (expecting 0x3E)!" on cold boot,
# uncomment: CONFIG_PMW3610_INIT_POWER_UP_EXTRA_DELAY_MS=1000
