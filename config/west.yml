manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: badjeff
      url-base: https://github.com/badjeff
  projects:
    - name: zmk
      remote: zmkfirmware
      revision: v0.3
      import: app/west.yml
    # PMW3610 driver: badjeff's maintained fork, zmk-0.3 branch (pinned).
    # Do NOT use main: it targets ZMK main/Zephyr 4.1 with the renamed
    # pixart,pmw3610-alt compatible and CONFIG_PMW3610_ALT_* prefix.
    - name: zmk-pmw3610-driver
      remote: badjeff
      revision: 5c5af40de4d8cdf55dc63c4c5907af1e52da6a95
    # NOTE: the pipeline-switch module (cursor/snipe/fast pointer modes) is
    # VENDORED at config/modules/input_processor_pipeline_switch (upstream:
    # Good-Great-Grand-Wonderful/zmk-input-processor-pipeline-switch @
    # 92e59e86ee, pre-GATT snapshot, patched for Zephyr 3.5). It is NOT a west
    # project; build.yaml passes it via ZMK_EXTRA_MODULES.

  self:
    path: config
